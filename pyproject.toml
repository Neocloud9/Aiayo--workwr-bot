[tool.poetry]
name = "aiayo-workwr-bot"
version = "0.1.0"
description = "A bot for Aiayo"
authors = ["cloudkleviosa@gmail.com"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Neocloud9/Aiayo--workwr-bot"
repository = "https://github.com/Neocloud9/Aiayo--workwr-bot"
keywords = ["aiayo", "bot", "automation"]

# Only include this if your code is inside a package directory like:
# aiayo_workwr_bot/
# packages = [{ include = "aiayo_workwr_bot" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# Add your app/runtime dependencies here
# Example:
# requests = "^2.32.0"
# python-dotenv = "^1.0.1"
# httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"
black = "^24.8.0"
mypy = "^1.11.0"

[tool.poetry.scripts]
# Example if you want a CLI command:
# aiayo-workwr-bot = "aiayo_workwr_bot:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
