[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiayo-workwr-bot"
version = "0.1.0"
description = "A bot for Aiayo"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Cloud Kleviousa", email = "kleviousacloud@gmail.com" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "stripe>=7.0.0",
    "pydantic>=2.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0"
    "schedule"]

project.optional-dependencies
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0"
]
[tool.setuptools]
py-modules = ["autoyield_worker_bot"]



